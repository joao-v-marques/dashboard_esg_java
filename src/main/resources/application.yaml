server:
  forward-headers-strategy: framework
  servlet:
    context-path: /dashboard-esg

app:
  jwt:
    secret: ${JWT_SECRET:minha_super_chave_secreta_que_ninguem_sabe}
    expiration: ${JWT_EXPIRATION:86400000}
  security:
    cookie-secure: ${COOKIE_SECURE:false}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/dashboard_esg}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  application:
    name: dashboard-esg
  http:
    clients:
      connect-timeout: 5s
      read-timeout: 15s