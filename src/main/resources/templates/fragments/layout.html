<!doctype html>
<!--
  Fragments compartilhados pelas telas autenticadas: head, topbar e sidebar.
  Só estrutura: os dados do usuário são preenchidos por js/shell.js a partir
  do GET /api/auth/me. Para um novo módulo, adicione o link na sidebar e passe
  o identificador em sidebar('<modulo>') na página.
  Itens restritos levam data-requires-role="<ROLE>" e hidden: js/shell.js revela
  para quem tem a role (com a hierarquia do backend); a rota é protegida no SecurityConfig.
-->
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:fragment="appHead(title)">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="color-scheme" content="light dark">
        <meta name="app-base" th:content="@{/}">
        <title th:text="${title} + ' · Acompanhamento ESG'">Acompanhamento ESG</title>

        <link rel="icon" type="image/svg+xml" th:href="@{/img/logo.svg}">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet"
              href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">

        <script th:src="@{/js/theme-init.js}"></script>
        <link rel="stylesheet" th:href="@{/css/tokens.css}">
        <link rel="stylesheet" th:href="@{/css/base.css}">
        <link rel="stylesheet" th:href="@{/css/app.css}">
        <link rel="stylesheet" th:href="@{/css/components.css}">
    </th:block>
</head>
<body>

<!-- ======================================================================
     Topbar
     ====================================================================== -->
<header class="topbar" th:fragment="topbar">
    <button class="topbar__menu" type="button" data-sidebar-toggle
            aria-controls="sidebar" aria-expanded="false" aria-label="Abrir menu de navegação">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>

    <a class="brand" th:href="@{/home}" aria-label="Acompanhamento ESG — página inicial">
        <img class="brand__logo" th:src="@{/img/logo.svg}" alt="" width="38" height="38">
        <span class="brand__name">Acompanhamento <strong>ESG</strong></span>
    </a>

    <div class="user-menu" data-user-menu>
        <button class="user-menu__trigger" type="button" data-user-menu-trigger
                aria-haspopup="menu" aria-expanded="false" aria-controls="user-menu-dropdown">
            <span class="avatar" data-user-initials aria-hidden="true"></span>
            <span class="user-menu__info">
                <span class="user-menu__name" data-user-name><span class="skeleton skeleton--line" style="width: 128px"></span></span>
                <span class="user-menu__meta" data-user-meta><span class="skeleton skeleton--line skeleton--sm" style="width: 88px"></span></span>
            </span>
            <svg class="user-menu__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>

        <div class="user-menu__dropdown" id="user-menu-dropdown" role="menu" aria-label="Menu do usuário" data-user-menu-dropdown hidden>
            <div class="user-menu__header">
                <span class="avatar avatar--lg" data-user-initials aria-hidden="true"></span>
                <div class="user-menu__header-text">
                    <p class="user-menu__header-name" data-user-name></p>
                    <p class="user-menu__header-username" data-user-username></p>
                </div>
            </div>

            <dl class="user-menu__details">
                <div>
                    <dt>Função</dt>
                    <dd data-user-role>-</dd>
                </div>
                <div>
                    <dt>Setor</dt>
                    <dd data-user-sector>-</dd>
                </div>
            </dl>

            <button class="user-menu__item" type="button" role="menuitemcheckbox" aria-checked="false" data-theme-toggle>
                <svg class="theme-icon theme-icon--moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
                <svg class="theme-icon theme-icon--sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                <span data-theme-toggle-label>Modo escuro</span>
                <span class="theme-switch" aria-hidden="true"></span>
            </button>

            <button class="user-menu__item" type="button" role="menuitem" data-change-password>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6M15.5 7.5l3 3L22 7l-3-3"/></svg>
                <span>Trocar senha</span>
            </button>

            <hr class="user-menu__separator">

            <button class="user-menu__item user-menu__item--danger" type="button" role="menuitem" data-logout>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
                <span data-logout-label>Sair da conta</span>
            </button>
        </div>
    </div>
</header>

<!-- ======================================================================
     Sidebar — um item por módulo
     ====================================================================== -->
<aside class="sidebar" id="sidebar" th:fragment="sidebar(active)" data-sidebar>
    <nav class="sidebar__nav" aria-label="Módulos">
        <p class="sidebar__label">Geral</p>
        <ul class="sidebar__list">
            <li>
                <a class="sidebar__link" th:href="@{/home}"
                   th:classappend="${active == 'home'} ? 'is-active'"
                   th:attr="aria-current=${active == 'home'} ? 'page' : null">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
                    <span>Início</span>
                </a>
            </li>
            <li data-requires-role="EMPLOYEE_WASTES" hidden>
                <a class="sidebar__link" th:href="@{/dashboard}"
                   th:classappend="${active == 'dashboard'} ? 'is-active'"
                   th:attr="aria-current=${active == 'dashboard'} ? 'page' : null">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M7 16v-3M12 16V8M17 16v-6"/></svg>
                    <span>Dashboard</span>
                </a>
            </li>
        </ul>

        <!-- O rótulo "Módulos" só aparece para quem tem ao menos um módulo -->
        <p class="sidebar__label sidebar__label--section" data-requires-role="EMPLOYEE_WASTES" hidden>Módulos</p>
        <ul class="sidebar__list">
            <!-- Grupo recolhível: vem aberto quando a página ativa pertence a ele (js/shell.js alterna) -->
            <li class="sidebar__group" th:with="inWastes=${active == 'wastes'}" data-requires-role="EMPLOYEE_WASTES" hidden>
                <button class="sidebar__link sidebar__group-toggle" type="button" data-nav-group
                        aria-controls="nav-residuos"
                        th:classappend="${inWastes} ? 'has-active'"
                        th:attr="aria-expanded=${inWastes} ? 'true' : 'false'">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 19H4.8a1.8 1.8 0 0 1-1.6-2.7l3.9-6.7"/><path d="m11 19 3 3M11 19l3-3M11 19h6.2a1.8 1.8 0 0 0 1.6-2.7l-1.2-2"/><path d="m14.2 7.4-1.6-2.6a1.8 1.8 0 0 0-3.1 0L8.4 6.6"/><path d="m7.1 9.6-3.1-.8.8 3.1M14.2 7.4l3.1.8-.8-3.1"/></svg>
                    <span>Resíduos</span>
                    <svg class="sidebar__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
                </button>
                <ul class="sidebar__sublist" id="nav-residuos" th:attr="hidden=${inWastes} ? null : 'hidden'">
                    <li>
                        <a class="sidebar__sublink" th:href="@{/wastes}"
                           th:classappend="${inWastes} ? 'is-active'"
                           th:attr="aria-current=${inWastes} ? 'page' : null">Controlar Resíduos</a>
                    </li>
                </ul>
            </li>
        </ul>
    </nav>

    <div class="sidebar__footer">
        <div class="sidebar__note">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.5 19 2c1 2 2 4.2 2 8 0 5.5-4.8 10-10 10Z"/><path d="M2 21c0-3 1.9-5.4 5.1-6"/></svg>
            <p>Outros módulos ESG aparecerão aqui conforme forem disponibilizados.</p>
        </div>

        <!-- Só administradores: o link é revelado por js/shell.js e a rota é protegida no SecurityConfig -->
        <ul class="sidebar__list sidebar__list--bottom" data-requires-role="ADMINISTRATOR" hidden>
            <li>
                <a class="sidebar__link" th:href="@{/settings}"
                   th:classappend="${active == 'settings'} ? 'is-active'"
                   th:attr="aria-current=${active == 'settings'} ? 'page' : null">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.2 2h-.4a2 2 0 0 0-2 2v.2a2 2 0 0 1-1 1.7l-.4.3a2 2 0 0 1-2 0l-.2-.1a2 2 0 0 0-2.7.7l-.2.4a2 2 0 0 0 .7 2.7l.2.1a2 2 0 0 1 1 1.7v.6a2 2 0 0 1-1 1.7l-.2.1a2 2 0 0 0-.7 2.7l.2.4a2 2 0 0 0 2.7.7l.2-.1a2 2 0 0 1 2 0l.4.3a2 2 0 0 1 1 1.7v.2a2 2 0 0 0 2 2h.4a2 2 0 0 0 2-2v-.2a2 2 0 0 1 1-1.7l.4-.3a2 2 0 0 1 2 0l.2.1a2 2 0 0 0 2.7-.7l.2-.4a2 2 0 0 0-.7-2.7l-.2-.1a2 2 0 0 1-1-1.7v-.6a2 2 0 0 1 1-1.7l.2-.1a2 2 0 0 0 .7-2.7l-.2-.4a2 2 0 0 0-2.7-.7l-.2.1a2 2 0 0 1-2 0l-.4-.3a2 2 0 0 1-1-1.7V4a2 2 0 0 0-2-2Z"/><circle cx="12" cy="12" r="3"/></svg>
                    <span>Configurações</span>
                </a>
            </li>
        </ul>
    </div>
</aside>

</body>
</html>
