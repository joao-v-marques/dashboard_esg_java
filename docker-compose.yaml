services:
  postgres:
    image: postgres:18-alpine
    container_name: dashboard-esg-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: dashboard_esg
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234"
    ports:
      - "5435:5432"
    volumes:
      - dashboard_esg_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d dashboard_esg" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  dashboard_esg_data: